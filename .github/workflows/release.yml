name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required to create/update GitHub Releases

jobs:
  # ── Linux ──────────────────────────────────────────────────────────────────
  build-appimage:
    runs-on: ubuntu-22.04   # oldest LTS = broadest AppImage compatibility

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            gir1.2-webkit2-4.0 \
            libgirepository1.0-dev \
            ffmpeg \
            upx-ucl

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyinstaller

      - name: Build AppImage
        run: bash packaging/build_appimage.sh

      - name: Upload AppImage to release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/AxEdUp-*.AppImage
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Windows ────────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyinstaller

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        run: .\packaging\build_windows.ps1

      - name: Upload installer to release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/AxEdUp-*-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── macOS ──────────────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: brew install create-dmg

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyinstaller

      - name: Build macOS DMG
        run: bash packaging/build_macos.sh

      - name: Upload DMG to release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/AxEdUp-*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
