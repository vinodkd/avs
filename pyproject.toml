[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "avs"
version = "0.1.6"
description = "Adventure video editing and sharing tool"
requires-python = ">=3.10"
dependencies = [
    # CLI
    "typer>=0.12",

    # Video processing
    "ffmpeg-python>=0.2",
    "imageio-ffmpeg>=0.5",
    "opencv-python-headless>=4.9",
    "scenedetect>=0.6",

    # Database
    "sqlalchemy>=2.0",
    "alembic>=1.13",

    # Filesystem
    "watchdog>=4.0",

    # Terminal output
    "rich>=13.0",

    # Phase 2 — UI and LLM
    "nicegui>=3.0",
    "pywebview>=4.0",
    "ollama>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
avs    = "avs.cli:app"
avs-ui = "avs.main:main"

[tool.hatch.build.targets.wheel]
packages = ["avs"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
