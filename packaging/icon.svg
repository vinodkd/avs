<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <clipPath id="c"><circle cx="50" cy="50" r="49"/></clipPath>
  </defs>
  <!-- Background: light green -->
  <circle cx="50" cy="50" r="49" fill="#5ab85a"/>
  <g clip-path="url(#c)">
    <!-- "Ax" shifted right to center the whole group; "Ax"≈52px + gap 4px + arrow 18px = 74px → start at x=13 -->
    <text x="13" y="66"
          font-family="Arial Black,Arial,sans-serif"
          font-weight="900"
          font-size="38"
          fill="#ffffff">Ax</text>
    <!-- Arrow centered at x=77, tip at cap-height of A (~y=38), close to "x" -->
    <polygon points="77,38 68,51 86,51" fill="#1a3a1a"/>
    <rect x="72" y="49" width="10" height="17" rx="1" fill="#1a3a1a"/>
  </g>
</svg>
